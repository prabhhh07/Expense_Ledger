<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4B2A8F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Royal Ledger – Yearly Expense Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lora:wght@400;500;600;700&family=Outfit:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="v"></div>
<button class="fab" id="add">+ Add expense</button>
<nav class="tabbar">
  <button data-act="tab" data-v="home"><span>🏛️</span>Home</button>
  <button data-act="tab" data-v="rep"><span>📜</span>Reports</button>
  <button data-act="tab" data-v="set"><span>⚙️</span>Settings</button>
</nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Add expense">
  <h3>New expense</h3>
  <div class="amt"><span>₹</span><input id="amount" type="number" inputmode="decimal" placeholder="0" min="0"></div>
  <div class="cats" id="cats"></div>
  <div class="fields"><input id="note" type="text" placeholder="Note (optional)" maxlength="40"><input id="date" type="date"></div>
  <button class="btn" id="save" disabled>Save expense</button>
</div>

<script src="app.js"></script>
<script>if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}</script>
</body>
</html>
